services:
  n8n:
    image: n8nio/n8n
    container_name: n8n_worker
    restart: always
    ports:
      - '5678:5678'
    environment:
      - N8N_EDITOR_BASE_URL=https://${DOMAIN}
      - WEBHOOK_URL=https://${DOMAIN}/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/backup/workflows
    depends_on:
      - postgres

  # --- НОВЫЙ БЛОК: DIFY ---
  dify-db:
    image: postgres:15
    container_name: dify_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=dify
    volumes:
      - [cite_start]dify_db_data:/var/lib/postgresql/data [cite: 1]

  redis:
    image: redis:6-alpine
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data

  dify-api:
    image: langgenius/dify-api:latest
    container_name: dify_api
    restart: always
    environment:
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=dify-db
      - DB_DATABASE=dify
      - REDIS_HOST=redis
      - CONSOLE_API_URL=http://localhost:5001
      - CONSOLE_WEB_URL=http://localhost:8080
      - SERVICE_API_URL=http://localhost:5001
      - APP_API_URL=http://localhost:5001
      - APP_WEB_URL=http://localhost:8080
      # Настройка для подключения к твоей Ollama
      - OLLAMA_API_BASE_URL=http://ollama:11434
    depends_on:
      - dify-db
      - redis
      - ollama

  dify-worker:
    image: langgenius/dify-api:latest
    container_name: dify_worker
    restart: always
    environment:
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=dify-db
      - DB_DATABASE=dify
      - REDIS_HOST=redis
      - MODE=worker
    depends_on:
      - dify-api

  dify-web:
    image: langgenius/dify-web:latest
    container_name: dify_web
    restart: always
    ports:
      - '8080:80'
    environment:
      - CONSOLE_API_URL=http://localhost:5001
      - APP_API_URL=http://localhost:5001
    depends_on:
      - dify-api

  # --- ТВОИ СУЩЕСТВУЮЩИЕ СЕРВИСЫ ---
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - '11434:11434'
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok_tunnel
    restart: always
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - 'http'
      - 'n8n:5678'
      - '--domain=${DOMAIN}'

  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - [cite_start]'5432:5432' [cite: 1]

volumes:
  n8n_data:
  ollama_storage:
  postgres_data:
  dify_db_data:
  redis_data: