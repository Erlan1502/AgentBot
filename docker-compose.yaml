services:
  n8n:
    image: n8nio/n8n
    container_name: n8n_worker
    restart: always
    ports:
      - '5678:5678'
    environment:
      - N8N_EDITOR_BASE_URL=https://${DOMAIN}
      - WEBHOOK_URL=https://${DOMAIN}/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/backup/workflows
    depends_on:
      - postgres
  weaviate:
    image: semitechnologies/weaviate:1.19.0
    container_name: weaviate
    restart: always
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_data:/var/lib/weaviate
  # --- НОВЫЙ БЛОК: DIFY ---
  dify-db:
    image: postgres:15
    container_name: dify_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=dify
    volumes:
      - dify_db_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data

  dify-api:
    image: langgenius/dify-api:0.12.1
    container_name: dify_api
    restart: always
    environment:
      - MODE=api
      - SECRET_KEY=sk-777-studio-project-unique-key-12345
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=dify-db
      - DB_DATABASE=dify
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Настройка очередей через Redis
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - BROKER_URL=redis://redis:6379/1
      # Хранилище
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=storage
      # Ссылки для браузера
      - CONSOLE_API_URL=http://localhost:5001
      - CONSOLE_WEB_URL=http://localhost:8080
      - SERVICE_API_URL=http://localhost:5001
      - APP_API_URL=http://localhost:5001
      - APP_WEB_URL=http://localhost:8080
      - OLLAMA_API_BASE_URL=http://ollama:11434
      - VECTOR_STORE=weaviate
      - WEAVIATE_ENDPOINT=http://weaviate:8080
      - WEAVIATE_API_KEY=WVFZ9wv9A979At69y9364H3v6743hC3v
    ports:
      - '5001:5001'
    volumes:
      - ./dify/storage:/app/api/storage
    depends_on:
      - dify-db
      - redis
      - ollama

  dify-worker:
    image: langgenius/dify-api:0.12.1
    container_name: dify_worker
    restart: always
    environment:
      - MODE=worker
      - SECRET_KEY=sk-777-studio-project-unique-key-12345
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=dify-db
      - DB_DATABASE=dify
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - BROKER_URL=redis://redis:6379/1
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=storage
      - VECTOR_STORE=weaviate
      - WEAVIATE_ENDPOINT=http://weaviate:8080
      - WEAVIATE_API_KEY=WVFZ9wv9A979At69y9364H3v6743hC3v
    volumes:
      - ./dify/storage:/app/api/storage
    depends_on:
      - dify-api

  dify-web:
    image: langgenius/dify-web:0.12.1 # Фиксируем стабильную версию вместо latest
    container_name: dify_web
    restart: always
    ports:
      - '8080:3000'
    environment:
      # Настройки для браузера (клиентская часть)
      - CONSOLE_API_URL=http://127.0.0.1:5001
      - APP_API_URL=http://127.0.0.1:5001
      # Настройки для сервера (внутренняя часть Docker)
      - DIFY_API_URL=http://dify-api:5001
      # Локализация (исправляет ошибку 't')
      - LOCALE_CONF=ru-RU
      - I18N_DEFAULT_LANGUAGE=ru-RU
      # Базовые настройки
      - NODE_ENV=production
      - NEXT_PUBLIC_DEPLOY_ENV=PRODUCTION
    depends_on:
      - dify-api

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - '11434:11434'
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok_tunnel
    restart: always
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - 'http'
      - 'n8n:5678'
      - '--domain=${DOMAIN}'

  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

volumes:
  n8n_data:
  ollama_storage:
  postgres_data:
  dify_db_data:
  redis_data:
  weaviate_data:
